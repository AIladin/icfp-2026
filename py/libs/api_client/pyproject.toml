[project]
name = "icfp-api-client"
version = "0.1.0"
description = "Client and CLI for the ICFP Contest 2026 API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
]

[project.scripts]
icfp = "icfp_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The import package (icfp_api) does not match the distribution name (icfp-api-client).
[tool.hatch.build.targets.wheel]
packages = ["src/icfp_api"]
