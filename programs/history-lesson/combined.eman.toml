problem = "history-lesson"

[rooms]
drum = "history-drum-direct"
dec = "history-dec"
exp = "history-exp-dict"
year = "history-year"
relay = "history-relay"
output = "output"

[[pipes]]
from = "drum.out"
to = "dec.feed"
min = 2

[[pipes]]
from = "dec.out"
to = "exp.stream"
min = 2

[[pipes]]
from = "exp.ring_out"
to = "relay.feed"
# 40 phrases plus the year occupy the two legs plus RELAY's held word.
min = 40

[[pipes]]
from = "relay.out"
to = "exp.ring_in"
min = 2

[[pipes]]
from = "exp.out"
to = "year.feed"
min = 2

[[pipes]]
from = "year.out"
to = "output.feed"
min = 2
