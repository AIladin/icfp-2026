# Depth-32-safe pipeline. Base 3 requires an explicit S-t sign branch in STACK.
problem = "brackets"

[rooms]
input = "input"
decode = "brackets-decoder"
stack = "brackets-stack3"
counter = "brackets-counter"
output = "output"

[[pipes]]
from = "input.out"
to = "decode.feed"
min = 2

[[pipes]]
from = "decode.out"
to = "stack.feed"
min = 2

[[pipes]]
from = "stack.verdict"
to = "counter.feed"
min = 2

[[pipes]]
from = "counter.out"
to = "output.feed"
min = 2
