# Safe seeded-sentinel pipeline with narrow stack and flat counter.
problem = "brackets"

[rooms]
input = "input"
decode = "brackets-decoder-seed1"
stack = "brackets-stack3-sentinel-narrow"
counter = "brackets-counter-flat"
output = "output"

[[pipes]]
from = "input.out"
to = "decode.feed"
min = 2

[[pipes]]
from = "decode.out"
to = "stack.feed"
min = 2

[[pipes]]
from = "stack.verdict"
to = "counter.feed"
min = 2

[[pipes]]
from = "counter.out"
to = "output.feed"
min = 2
